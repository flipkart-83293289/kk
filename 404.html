<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
      (function() {
        const VERIFY_KEYWORD = 'apple-iphone-17-pro';
        const currentUrl = window.location.href;

        // आपकी Repo का असली रूट (जहाँ index.html है)
        const REPO_ROOT = '/kk/';

        // अगर URL में verification keyword है (रिफ्रेश करने पर भी keyword URL में ही रहेगा)
        if (currentUrl.includes(VERIFY_KEYWORD)) {
          // URL का Search Params और Hash बचाकर वापस index.html पर भेजें
          const searchAndHash = window.location.search + window.location.hash;
          window.location.replace(REPO_ROOT + searchAndHash);
        } else {
          // अगर बिना कीवर्ड का गलत लिंक है
          window.location.replace('https://www.flipkart.com');
        }
      })();
    </script>
</head>
<body>
</body>
</html>
